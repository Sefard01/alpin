<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick URL Shortener 🚀</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">URL Shortener</h1>
        <p class="text-gray-500 mb-6">Enter a long URL to make it short and sweet.</p>
        
        <form action="/shorten" method="post" class="space-y-4">
            <input type="url" name="url" placeholder="https://example.com" required 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Shorten URL
            </button>
        </form>

        {% if short_url %}
        <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
            <p class="text-green-800 font-medium">Your Short URL:</p>
            <a href="{{ short_url }}" target="_blank" class="text-blue-600 underline font-bold break-all">{{ short_url }}</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
